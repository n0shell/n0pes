<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PES 6 League Manager</title>
<style>
:root{color-scheme:dark;--bg:#0a1110;--c:#12201b;--c2:#1a2c25;--g:#22c55e;--t:#e8f1ec;--m:#8aa399;--r:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(90deg,#052e16,#0f3d27);border-bottom:2px solid var(--g);padding:10px 14px;display:flex;align-items:center;gap:10px}
header b{font-size:18px;letter-spacing:.5px}header small{color:var(--m);display:block}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;background:#0d1815;position:sticky;top:0;z-index:5}
nav button{background:none;border:0;color:var(--m);padding:8px 12px;border-radius:6px;white-space:nowrap;cursor:pointer;font-weight:600}
nav button.on{background:var(--g);color:#04210f}
main{max-width:1000px;margin:0 auto;padding:12px}
.card{background:var(--c);border:1px solid #223a31;border-radius:10px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;color:var(--g);text-transform:uppercase;font-size:13px;letter-spacing:1px}
button,select,input,textarea{font:inherit}
.btn,.card button{background:var(--g);color:#04210f;border:0;border-radius:6px;padding:7px 12px;font-weight:700;cursor:pointer}
button.s{background:var(--c2)!important;color:var(--t)!important}button.d{background:var(--r)!important;color:#fff!important}
input,select,textarea{background:#0b1512;color:var(--t);border:1px solid #2b4a3d;border-radius:6px;padding:6px 8px;max-width:100%}
textarea{width:100%;min-height:90px}label{display:flex;flex-direction:column;gap:3px;color:var(--m);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:6px 7px;text-align:center;border-bottom:1px solid #1f352c;white-space:nowrap}
th{color:var(--m);font-size:11px;text-transform:uppercase}td.l,th.l{text-align:left}tr.q td:first-child{box-shadow:inset 3px 0 var(--g)}
.tm{display:inline-flex;align-items:center;gap:6px}.tm small{color:var(--m)}.cr{flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chips button{background:var(--c2);color:var(--t);border:1px solid #2b4a3d;border-radius:20px;padding:4px 11px;cursor:pointer}
.chips button.on{background:var(--g);color:#04210f}.chips button.ok{border-color:var(--g)}
.m{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #1f352c}
.m .a{justify-self:end;text-align:right}.sc{display:flex;gap:4px;align-items:center}.sc input{width:70px;height:46px;font-size:24px;font-weight:800;text-align:center;padding:4px;-moz-appearance:textfield}.sc input::-webkit-outer-spin-button,.sc input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.po .sc input{width:54px;height:40px;font-size:20px}
.warn{background:#3a2f0b;border:1px solid #a16207;border-radius:8px;padding:8px 12px;margin-bottom:12px}
.big{font-size:26px;font-weight:800;color:var(--g)}.mu{color:var(--m)}.bold{font-weight:800}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#fff;color:#111;padding:9px 16px;border-radius:8px;font-weight:600;display:none;z-index:9;max-width:90%}
.po{display:flex;gap:14px;overflow-x:auto}.po>div{min-width:230px;flex:1}.pm{background:var(--c2);border-radius:8px;padding:8px;margin-bottom:10px}
.pm .sc{justify-content:space-between;margin:3px 0}.champ{text-align:center;padding:16px;background:linear-gradient(135deg,#14532d,#0f3d27);border-radius:10px;font-size:20px;font-weight:800;margin-bottom:12px}
@media(max-width:560px){.m{grid-template-columns:1fr;justify-items:center;text-align:center}.m .a{justify-self:center;text-align:center}}
#inwrap{max-width:460px;margin:0 auto}
#inwrap input,#inwrap select{width:100%;padding:12px;font-size:16px}
#inwrap .btn{width:100%;margin-top:14px;padding:13px;font-size:16px}
#inwrap .btn:disabled{opacity:.5;cursor:not-allowed}
#inmsg{margin-top:12px;min-height:1.4em;font-weight:600}
.il{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #1f352c}.il span.mu{margin-left:auto;font-size:12px}
</style></head><body>
<header><svg width="30" height="30" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#22c55e" stroke-width="2"/><path d="M12 7l4 3-1.5 5h-5L8 10z" fill="#22c55e"/></svg><div><b>PES 6 LEAGUE MANAGER</b><small id="tn"></small></div></header>
<nav id="nav"></nav><main id="app"></main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CLS="Athletic Club|#dc2626,FC Barcelona|#a50044,Real Betis|#0bb363,Celta de Vigo|#7ec8ee,RCD Espanyol|#1d4ed8,Elche CF|#16a34a,CA Osasuna|#b91c1c,Levante UD|#b3123a,Deportivo Alavés|#1e40af,Cádiz CF|#facc15,Atlético de Madrid|#cb3524,Real Madrid|#e5e7eb,RCD Mallorca|#c8102e,Getafe CF|#2563eb,Rayo Vallecano|#e11d48,Granada CF|#9f1239,Villarreal CF|#eab308,Valencia CF|#f59e0b,Sevilla FC|#d11f2d,Real Sociedad|#3b82f6".split(',').map(x=>x.split('|'));
const CM=Object.fromEntries(CLS);
const shuf=a=>{a=[...a];for(let i=a.length;i>1;){const j=Math.random()*i|0;i--;[a[i],a[j]]=[a[j],a[i]]}return a};
const lum=c=>{const n=parseInt(c.slice(1),16);return(n>>16)*.3+((n>>8)&255)*.6+(n&255)*.1};
function crest(n,sz=26){let bg=CM[n],fg;if(bg)fg=lum(bg)>150?'#111':'#fff';else{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;bg=`hsl(${h},55%,38%)`;fg='#fff'}
const t=esc(n.replace(/[^A-Za-zÀ-ÿ ]/g,'').split(' ').filter(Boolean).map(w=>w[0]).join('').slice(0,3).toUpperCase());
return `<svg class="cr" width="${sz}" height="${sz*1.15|0}" viewBox="0 0 24 28"><path d="M2 2h20v12c0 7-6 11-10 12C8 25 2 21 2 14z" fill="${bg}" stroke="#fff" stroke-width="1.5"/><text x="12" y="17" text-anchor="middle" font-size="${t.length>2?8:10}" font-weight="800" fill="${fg}">${t}</text></svg>`}
const K='pes6lm',KB='pes6lm_bk';
const fresh=()=>({cfg:{name:'Mi torneo PES 6',legs:2,dup:false,fin:false,q:2,win:3,draw:1},groups:[{id:1,name:'Liga'}],P:[],F:[],po:null,nid:1,dirty:false});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S&&S.cfg?S:fresh();
let tab='inicio',cg=null,crd={},armed=null;
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)}
function ok(k,msg){if(armed==k){armed=null;return true}armed=k;toast(msg+' — pulsa de nuevo para confirmar');setTimeout(()=>armed==k&&(armed=null),4000);return false}
function bks(){try{return JSON.parse(localStorage.getItem(KB))||[]}catch(e){return[]}}
function bk(l){try{const b=bks();b.unshift({t:Date.now(),l,d:JSON.stringify(S)});localStorage.setItem(KB,JSON.stringify(b.slice(0,5)))}catch(e){}}
const P=id=>S.P.find(p=>p.id==id);
const tm=(id,sm=1)=>{const p=P(id);return p?`<span class="tm">${crest(p.club,22)}<span><b>${esc(p.club)}</b>${sm?`<small> ${esc(p.n)}</small>`:''}</span></span>`:'—'};
const opts=(v,a)=>a.map(([x,l])=>`<option value="${x}"${x==v?' selected':''}>${l}</option>`).join('');
const played=f=>f.hg!=null&&f.ag!=null;
// ---------- calendario ----------
function sched(ids){let a=shuf(ids);if(a.length%2)a.push(null);const n=a.length,R=[];
for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x==null||y==null)continue;m.push((i==0?r%2:(r+i)%2)?[y,x]:[x,y])}R.push(m);a.splice(1,0,a.pop())}
return S.cfg.legs==2?R.concat(R.map(m=>m.map(([h,a])=>[a,h]))):R}
function gen(){if(S.P.length<2)return toast('Añade participantes');
if(S.groups.some(g=>S.P.filter(p=>p.g==g.id).length<2))return toast('Cada grupo necesita 2 o más participantes');
if(S.F.some(played)&&!ok('gen','Se borrarán los resultados'))return;
bk('Antes de generar calendario');S.F=[];S.po=null;S.dirty=false;crd={};
S.groups.forEach(g=>sched(S.P.filter(p=>p.g==g.id).map(p=>p.id)).forEach((m,ri)=>m.forEach(([h,a])=>S.F.push({id:S.nid++,g:g.id,r:ri+1,h,a,hg:null,ag:null}))));
save();render();toast('Calendario generado')}
// ---------- clasificación ----------
function table(g){const T={};S.P.filter(p=>p.g==g).forEach(p=>T[p.id]={id:p.id,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0});
const pl=S.F.filter(f=>f.g==g&&played(f));
pl.forEach(f=>{const h=T[f.h],a=T[f.a];if(!h||!a)return;h.pj++;a.pj++;h.gf+=f.hg;h.gc+=f.ag;a.gf+=f.ag;a.gc+=f.hg;
if(f.hg>f.ag){h.g++;a.p++;h.pts+=S.cfg.win}else if(f.hg<f.ag){a.g++;h.p++;a.pts+=S.cfg.win}else{h.e++;a.e++;h.pts+=S.cfg.draw;a.pts+=S.cfg.draw}});
const h2h=(x,y)=>{let s=0;pl.forEach(f=>{if(f.h==x&&f.a==y||f.h==y&&f.a==x){const gx=f.h==x?f.hg:f.ag,gy=f.h==x?f.ag:f.hg;s+=gx>gy?S.cfg.win:gx==gy?S.cfg.draw:0}});return s};
return Object.values(T).sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf||h2h(b.id,a.id)-h2h(a.id,b.id)||P(a.id).club.localeCompare(P(b.id).club))}
// ---------- acciones ----------
function addP(n,g){if(!g)g=S.groups.map(x=>[x,S.P.filter(p=>p.g==x.id).length]).sort((a,b)=>a[1]-b[1])[0][0].id;
const used=S.P.map(p=>p.club),free=shuf(CLS.map(c=>c[0])).filter(c=>S.cfg.dup||!used.includes(c));
S.P.push({id:S.nid++,n,club:free[0]||CLS[Math.random()*CLS.length|0][0],g});if(S.F.length)S.dirty=true}
function addOne(){const v=$('#na').value.trim();if(!v)return toast('Escribe un nombre');addP(v);save();render()}
function addList(){const l=$('#nl').value.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean);if(!l.length)return toast('Pega una lista de nombres');l.forEach(n=>addP(n));save();render();toast(l.length+' participantes añadidos')}
function pe(id,v){v=v.trim();if(!v)return render();P(id).n=v;save();render()}
function cl(id,v){v=v.trim();if(!v)return render();if(!S.cfg.dup&&S.P.some(p=>p.id!=id&&p.club.toLowerCase()==v.toLowerCase())){toast('Ese club ya está en uso en esta competición');return render()}P(id).club=v;save();render()}
function pg(id,v){P(id).g=+v;S.dirty=S.F.length>0;save();render()}
function del(id){if(!ok('d'+id,'Eliminar participante'))return;S.P=S.P.filter(p=>p.id!=id);S.F=S.F.filter(f=>f.h!=id&&f.a!=id);S.po=null;S.dirty=S.F.length>0;save();render()}
function cf(k,v){S.cfg[k]=v;if(k=='legs'||k=='q')S.dirty=S.dirty||(k=='legs'&&S.F.length>0);save();render()}
function mkGroups(n){S.groups=n==1?[{id:1,name:'Liga'}]:Array.from({length:n},(_,i)=>({id:i+1,name:'Grupo '+'ABCD'[i]}));S.P.forEach((p,i)=>p.g=S.groups[i%n].id);S.F=[];S.po=null;cg=null;crd={}}
function gc(n){if(S.F.some(played)&&!ok('gc','Se borrarán calendario y resultados'))return render();mkGroups(n);S.dirty=S.P.length>0;save();render()}
function sc(id,k,v){const f=S.F.find(x=>x.id==id);f[k]=v===''?null:Math.max(0,Math.floor(+v)||0);f.t=Date.now();save();render()}
function create(){const names=$('#wn').value.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean);if(names.length<2)return toast('Mínimo 2 participantes (recomendado 8 a 16)');
const gn=+$('#wg').value;S=fresh();S.cfg.name=$('#wt').value||'Mi torneo PES 6';S.cfg.legs=+$('#wl').value;S.cfg.fin=$('#wf').value=='1';S.cfg.dup=$('#wd').value=='1';
mkGroups(gn);shuf(names).forEach((n,i)=>addP(n,S.groups[i%gn].id));gen();tab='inicio';render()}
function demo(){if(S.P.length&&!ok('demo','Se reemplazarán los datos actuales'))return;bk('Antes de demo');S=fresh();S.cfg={name:'Liga Demo PES 6',legs:1,dup:false,fin:true,q:2,win:3,draw:1};mkGroups(2);
'Álex,Dani,Marcos,Jorge,Pablo,Iván,Raúl,Sergio,Nacho,Hugo,Carlos,Adri'.split(',').forEach((n,i)=>addP(n,S.groups[i%2].id));gen();
shuf(S.F).slice(0,Math.floor(S.F.length*.7)).forEach(f=>{f.hg=Math.random()*5|0;f.ag=Math.random()*4|0;f.t=Date.now()+Math.random()*1e5});save();tab='inicio';render();toast('Demo cargada')}
function reset(){if(!ok('reset','Se borrará TODO'))return;bk('Antes de borrar todo');S=fresh();save();tab='inicio';render()}
// ---------- fase final ----------
function qual(){const o=[];S.groups.forEach(g=>table(g.id).slice(0,S.cfg.q).forEach((r,i)=>o.push({id:r.id,pos:i,pts:r.pts,gd:r.gf-r.gc,gf:r.gf})));
return o.sort((a,b)=>a.pos-b.pos||b.pts-a.pts||b.gd-a.gd||b.gf-a.gf).map(x=>x.id)}
function startPO(){const s=qual(),n=s.length;if(![2,4,8,16].includes(n))return toast(`Clasifican ${n}: debe ser 2, 4, 8 o 16 (ajusta «clasifican por grupo»)`);
if(S.F.some(f=>!played(f))&&!ok('po','Aún hay partidos pendientes en la liga'))return;S.po={seeds:s,res:{}};save();render()}
const ord=N=>{let o=[0,1];while(o.length<N){const m=o.length*2;o=o.flatMap(x=>[x,m-1-x])}return o};
const win=(p,x)=>{if(p[0]==null||p[1]==null||x.h==null||x.a==null)return null;if(x.h>x.a)return p[0];if(x.a>x.h)return p[1];return x.ph!=null&&x.pa!=null&&x.ph!=x.pa?(x.ph>x.pa?p[0]:p[1]):null};
function bracket(){const s=S.po.seeds,o=ord(s.length);let cur=[];for(let i=0;i<o.length;i+=2)cur.push([s[o[i]],s[o[i+1]]]);const R=[];let r=0;
for(;;){const ms=cur.map((p,m)=>{const k=r+'_'+m,x=S.po.res[k]||{};return{p,k,x,w:win(p,x)}});R.push(ms);if(cur.length==1)break;const nx=[];for(let i=0;i<ms.length;i+=2)nx.push([ms[i].w,ms[i+1].w]);cur=nx;r++}return R}
function ps(k,f,v){const x=S.po.res[k]=S.po.res[k]||{};x[f]=v===''?null:Math.max(0,Math.floor(+v)||0);save();render()}
function resetPO(){if(!ok('rpo','Se borrarán cruces y resultados de la fase final'))return;S.po=null;save();render()}
// ---------- datos ----------
function exp(){$('#ex').value=JSON.stringify(S,null,1);toast('Datos exportados abajo: cópialos y guárdalos')}
function cp(){const t=$('#ex');if(!t.value)exp();t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}toast('Copiado')}
function imp(){try{const d=JSON.parse($('#im').value);if(!d.cfg||!d.P||!d.F)throw 0;if(!ok('imp','Se reemplazarán los datos actuales'))return;bk('Antes de importar');S=d;save();render();toast('Importado')}catch(e){toast('JSON no válido')}}
function file(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#im').value=r.result;toast('Archivo cargado: pulsa Importar')};r.readAsText(f)}
function mkbk(){bk('Copia manual');render();toast('Copia creada')}
function rest(i){if(!ok('rb'+i,'Restaurar copia'))return;S=JSON.parse(bks()[i].d);save();render();toast('Restaurada')}
// ---------- vistas ----------
const V={};
const gname=g=>S.groups.length>1?`<span class="mu"> · ${esc(g.name)}</span>`:'';
const warn=()=>S.dirty?`<div class="warn">Has cambiado participantes o formato: el calendario está desactualizado. <button onclick="gen()">Regenerar calendario</button></div>`:'';
function wizard(){return `<div class="card"><h3>Asistente de configuración</h3><div class="grid">
<label>Nombre del torneo<input id="wt" value="Liga de amigos PES 6"></label>
<label>Listas / grupos<select id="wg">${opts(1,[[1,'1 (liga única)'],[2,'2 listas'],[3,'3 listas'],[4,'4 listas']])}</select></label>
<label>Formato<select id="wl">${opts(2,[[1,'Solo ida'],[2,'Ida y vuelta']])}</select></label>
<label>Fase final entre grupos<select id="wf">${opts(0,[[0,'No'],[1,'Sí']])}</select></label>
<label>Permitir clubes repetidos<select id="wd">${opts(0,[[0,'No'],[1,'Sí']])}</select></label></div>
<label style="margin:10px 0">Participantes (8 a 16 recomendado; uno por línea o separados por comas)<textarea id="wn" placeholder="Álex&#10;Dani&#10;Marcos"></textarea></label>
<div class="row"><button onclick="create()">Crear torneo y calendario</button><button class="s" onclick="demo()">Cargar demostración</button></div>
<p class="mu">Los clubes se asignan al azar sin repetir; luego puedes cambiarlos en Participantes.</p></div>`}
V.inicio=()=>{if(!S.P.length)return wizard();const pj=S.F.filter(played).length;
const last=S.F.filter(played).sort((a,b)=>(b.t||0)-(a.t||0)).slice(0,6);
return `${warn()}<div class="grid"><div class="card"><div class="mu">Participantes</div><div class="big">${S.P.length}</div></div>
<div class="card"><div class="mu">Partidos jugados</div><div class="big">${pj}/${S.F.length}</div></div>
<div class="card"><div class="mu">Formato</div><div class="big" style="font-size:18px">${S.cfg.legs==2?'Ida y vuelta':'Solo ida'} · ${S.groups.length>1?S.groups.length+' listas':'liga única'}</div></div>
<div class="card"><div class="mu">Fase final</div><div class="big" style="font-size:18px">${!S.cfg.fin?'Desactivada':S.po?'En juego':'Pendiente'}</div></div></div>
<div class="card"><h3>Líderes</h3>${S.groups.map(g=>{const t=table(g.id)[0];return t?`<div style="padding:5px 0">🏆 ${tm(t.id)} <span class="mu">${t.pts} pts · ${esc(g.name)}</span></div>`:''}).join('')}</div>
<div class="card"><h3>Últimos resultados</h3>${last.map(f=>`<div style="padding:4px 0">${tm(f.h,0)} <b>${f.hg}-${f.ag}</b> ${tm(f.a,0)}</div>`).join('')||'<span class="mu">Aún no hay resultados.</span>'}</div>
<div class="card"><h3>Partidos pendientes</h3>${S.groups.map(g=>{const pend=S.F.filter(f=>f.g==g.id&&!played(f));const r=pend.length?Math.min(...pend.map(f=>f.r)):0;return `<div>${esc(g.name)}: ${pend.length?`${pend.length} pendientes · próxima jornada ${r}`:'liga completada ✔'}</div>`}).join('')}</div>`};
V.part=()=>{const c=S.cfg;return `${warn()}<div class="card"><h3>Ajustes</h3><div class="row">
<label>Torneo<input value="${esc(c.name)}" onchange="cf('name',this.value)"></label>
<label>Formato<select onchange="cf('legs',+this.value)">${opts(c.legs,[[1,'Solo ida'],[2,'Ida y vuelta']])}</select></label>
<label>Listas<select onchange="gc(+this.value)">${opts(S.groups.length,[1,2,3,4].map(x=>[x,x]))}</select></label>
<label>Clubes repetidos<select onchange="cf('dup',this.value=='1')">${opts(+c.dup,[[0,'No'],[1,'Sí']])}</select></label>
<label>Fase final<select onchange="cf('fin',this.value=='1')">${opts(+c.fin,[[0,'No'],[1,'Sí']])}</select></label>
<label>Clasifican/lista<input type="number" min="1" max="8" style="width:70px" value="${c.q}" onchange="cf('q',+this.value||1)"></label>
<label>Pts victoria<input type="number" min="0" style="width:70px" value="${c.win}" onchange="cf('win',+this.value)"></label>
<label>Pts empate<input type="number" min="0" style="width:70px" value="${c.draw}" onchange="cf('draw',+this.value)"></label></div></div>
<div class="card"><h3>Añadir participantes</h3><div class="row"><label>Uno solo<input id="na" placeholder="Nombre" onkeydown="if(event.key=='Enter')addOne()"></label><button onclick="addOne()">Añadir</button></div>
<label style="margin-top:10px">Pegar lista (líneas o comas)<textarea id="nl"></textarea></label><button style="margin-top:6px" onclick="addList()">Añadir lista</button></div>
<datalist id="cls">${CLS.map(c=>`<option value="${esc(c[0])}">`).join('')}</datalist>
<div class="card"><h3>Participantes (${S.P.length})</h3><div class="w"><table><tr><th class="l">Escudo</th><th class="l">Nombre</th><th class="l">Club</th>${S.groups.length>1?'<th>Lista</th>':''}<th></th></tr>
${S.P.map(p=>`<tr><td class="l">${crest(p.club,28)}</td><td class="l"><input value="${esc(p.n)}" onchange="pe(${p.id},this.value)" style="width:130px"></td>
<td class="l"><input list="cls" value="${esc(p.club)}" onchange="cl(${p.id},this.value)" style="width:170px"></td>
${S.groups.length>1?`<td><select onchange="pg(${p.id},this.value)">${opts(p.g,S.groups.map(g=>[g.id,g.name]))}</select></td>`:''}
<td><button class="d" onclick="del(${p.id})">✕</button></td></tr>`).join('')}</table></div></div>`};
V.cal=()=>{if(!S.F.length)return `${warn()}<div class="card">${S.P.length?'<p>Aún no hay calendario.</p><button onclick="gen()">Generar calendario</button>':'<p>Primero añade participantes.</p>'}</div>`;
const g=S.groups.find(x=>x.id==cg)||S.groups[0];cg=g.id;const fs=S.F.filter(f=>f.g==g.id),nr=Math.max(...fs.map(f=>f.r));
let r=crd[g.id];if(!r){const pe=fs.filter(f=>!played(f));r=pe.length?Math.min(...pe.map(f=>f.r)):1}
const ms=fs.filter(f=>f.r==r),busy=new Set(ms.flatMap(f=>[f.h,f.a])),rs=S.P.filter(p=>p.g==g.id&&!busy.has(p.id));
return `${warn()}${S.groups.length>1?`<div class="chips">${S.groups.map(x=>`<button class="${x.id==g.id?'on':''}" onclick="cg=${x.id};render()">${esc(x.name)}</button>`).join('')}</div>`:''}
<div class="chips">${Array.from({length:nr},(_,i)=>{const d=fs.filter(f=>f.r==i+1).every(played);return `<button class="${i+1==r?'on':d?'ok':''}" onclick="crd[${g.id}]=${i+1};render()">J${i+1}</button>`}).join('')}</div>
<div class="card"><h3>Jornada ${r} de ${nr}${S.cfg.legs==2?(r>nr/2?' · vuelta':' · ida'):''}</h3>
${ms.map(f=>`<div class="m"><div>${tm(f.h)}</div><div class="sc"><input type="number" min="0" value="${f.hg??''}" onchange="sc(${f.id},'hg',this.value)">–<input type="number" min="0" value="${f.ag??''}" onchange="sc(${f.id},'ag',this.value)"></div><div class="a">${tm(f.a)}</div></div>`).join('')}
${rs.length?`<p class="mu">Descansa: ${rs.map(p=>esc(p.club)).join(', ')}</p>`:''}
<div class="row" style="margin-top:8px"><button class="s" onclick="crd[${g.id}]=Math.max(1,${r}-1);render()">← Anterior</button><button class="s" onclick="crd[${g.id}]=Math.min(${nr},${r}+1);render()">Siguiente →</button><button class="s" onclick="gen()">Regenerar calendario</button></div></div>`};
V.cla=()=>S.P.length?S.groups.map(g=>{const t=table(g.id),pend=S.F.filter(f=>f.g==g.id&&!played(f)).length;return `<div class="card"><h3>${esc(g.name)} ${t[0]&&t[0].pj?`· Líder: ${esc(P(t[0].id).club)}`:''}${pend==0&&S.F.length&&t[0]?' · 🏆 Campeón: '+esc(P(t[0].id).club):''}</h3>
<div class="w"><table><tr><th>#</th><th class="l">Club</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>PTS</th></tr>
${t.map((r,i)=>`<tr class="${S.cfg.fin&&i<S.cfg.q?'q':''}"><td>${i+1}</td><td class="l">${tm(r.id)}</td><td>${r.pj}</td><td>${r.g}</td><td>${r.e}</td><td>${r.p}</td><td>${r.gf}</td><td>${r.gc}</td><td>${r.gf-r.gc}</td><td class="bold">${r.pts}</td></tr>`).join('')}</table></div>
<p class="mu">Desempate: puntos, diferencia de goles, goles a favor y enfrentamiento directo. Pendientes: ${pend}.</p></div>`}).join(''):'<div class="card">Sin participantes.</div>';
V.est=()=>{const all=S.groups.flatMap(g=>table(g.id)).filter(r=>r.pj>0);if(!all.length)return '<div class="card">Aún no hay resultados.</div>';
const L=(t,a,fn)=>`<div class="card"><h3>${t}</h3>${a.slice(0,3).map((r,i)=>`<div style="padding:4px 0">${i+1}. ${tm(r.id)} <b style="float:right">${fn(r)}</b></div>`).join('')}</div>`;
const big=S.F.filter(played).sort((a,b)=>Math.abs(b.hg-b.ag)-Math.abs(a.hg-a.ag)||b.hg+b.ag-a.hg-a.ag).slice(0,5);
return `<div class="grid">${L('Máximo goleador (goles a favor)',[...all].sort((a,b)=>b.gf-a.gf),r=>r.gf+' goles')}${L('Más victorias',[...all].sort((a,b)=>b.g-a.g||b.pts-a.pts),r=>r.g)}
${L('Mejor ataque (goles/partido)',[...all].sort((a,b)=>b.gf/b.pj-a.gf/a.pj),r=>(r.gf/r.pj).toFixed(2))}${L('Mejor defensa (encaja/partido)',[...all].sort((a,b)=>a.gc/a.pj-b.gc/b.pj),r=>(r.gc/r.pj).toFixed(2))}</div>
<div class="card"><h3>Mayores goleadas</h3>${big.map(f=>`<div style="padding:4px 0">${tm(f.h,0)} <b>${f.hg}-${f.ag}</b> ${tm(f.a,0)}</div>`).join('')}</div>
<p class="mu">Nota: no se registran goles por jugador de la partida, así que el «goleador» es el participante con más goles a favor.</p>`};
V.fin=()=>{if(!S.cfg.fin)return `<div class="card"><p>La fase final está desactivada.</p><button onclick="cf('fin',true)">Activar fase final</button></div>`;
if(!S.po){const q=qual();return `<div class="card"><h3>Fase final</h3><p>Clasifican los ${S.cfg.q} mejores de cada ${S.groups.length>1?'lista':'liga'} (${q.length} equipos). Los cruces se generan por siembra (1.º vs último…). Los resultados son independientes de la liga.</p>
<div style="margin-bottom:10px">${q.map((id,i)=>`<div style="padding:3px 0">${i+1}. ${tm(id)}</div>`).join('')}</div><button onclick="startPO()">Generar cruces</button></div>`}
const R=bracket(),n=R.length,nm=i=>({0:'Final',1:'Semifinales',2:'Cuartos',3:'Octavos'})[n-1-i];const ch=R[n-1][0].w;
return `${ch?`<div class="champ">🏆 Campeón: ${esc(P(ch).club)} <div class="mu" style="font-size:14px">${esc(P(ch).n)}</div></div>`:''}
<div class="po">${R.map((ms,i)=>`<div><h3>${nm(i)}</h3>${ms.map(m=>{const[a,b]=m.p,x=m.x,tie=x.h!=null&&x.h==x.a;const row=(id,f,pf)=>`<div class="sc"><span class="${m.w==id&&id!=null?'bold':''}">${id!=null?tm(id,0):'<span class="mu">Por definir</span>'}</span><span>${id!=null&&b!=null&&a!=null?`<input type="number" min="0" value="${x[f]??''}" onchange="ps('${m.k}','${f}',this.value)">${tie?` <input type="number" min="0" title="Penaltis" placeholder="P" value="${x[pf]??''}" onchange="ps('${m.k}','${pf}',this.value)">`:''}`:''}</span></div>`;
return `<div class="pm">${row(a,'h','ph')}${row(b,'a','pa')}${tie?'<div class="mu">Empate: introduce penaltis (P)</div>':''}</div>`}).join('')}</div>`).join('')}</div>
<button class="d" onclick="resetPO()">Reiniciar fase final</button>`};
V.dat=()=>`<div class="card"><h3>Exportar</h3><div class="row"><button onclick="exp()">Generar JSON</button><button class="s" onclick="cp()">Copiar</button></div><textarea id="ex" readonly style="margin-top:8px"></textarea></div>
<div class="card"><h3>Importar</h3><input type="file" accept=".json,application/json" onchange="file(this)"><textarea id="im" placeholder="Pega aquí el JSON exportado" style="margin-top:8px"></textarea><button style="margin-top:6px" onclick="imp()">Importar</button></div>
<div class="card"><h3>Copias de seguridad (últimas 5)</h3><button onclick="mkbk()">Crear copia ahora</button>
${bks().map((b,i)=>`<div class="row" style="padding:6px 0;border-bottom:1px solid #1f352c"><span>${new Date(b.t).toLocaleString('es-ES')} · ${esc(b.l)}</span><button class="s" onclick="rest(${i})">Restaurar</button></div>`).join('')}</div>
<div class="card"><h3>Zona peligrosa</h3><div class="row"><button class="s" onclick="demo()">Cargar demostración</button><button class="d" onclick="reset()">Borrar todo</button></div></div>`;
// ---------- inscripción online ----------
const INSC_WORKER='https://TU-WORKER.TU-SUBDOMINIO.workers.dev'; // URL de tu Cloudflare Worker
const INSC_REPO='TUUSUARIO/TUREPO';                              // usuario/repositorio de GitHub
let INS=[],insLoaded=false,ADMIN=false,APW='';
async function wk(body){const r=await fetch(INSC_WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return r.json()}
async function adminLogin(){const pw=prompt('Contraseña de administrador:');if(!pw)return;
try{const d=await wk({action:'login',password:pw});if(d.ok){ADMIN=true;APW=pw;try{sessionStorage.setItem('pes6_adm',pw)}catch(e){}tab='inicio';render();toast('Modo administrador activado')}else toast('Contraseña incorrecta')}catch(e){toast('Error de conexión')}}
function adminLogout(){ADMIN=false;APW='';try{sessionStorage.removeItem('pes6_adm')}catch(e){}tab='insc';render()}
async function delIns(nombre){if(!ADMIN||!ok('di'+nombre,'Eliminar a '+nombre))return;
try{const d=await wk({action:'borrar',password:APW,nombre});if(d.ok){toast('Orden enviada: se actualizará en 1-2 minutos');INS=INS.filter(i=>i.nombre!=nombre);paintIns();setTimeout(loadIns,45000)}else toast('No autorizado o error')}catch(e){toast('Error de conexión')}}
async function clearIns(){if(!ADMIN||!ok('ci','Se vaciarán TODAS las inscripciones'))return;
try{const d=await wk({action:'vaciar',password:APW});if(d.ok){toast('Orden enviada: se vaciará en 1-2 minutos');INS=[];paintIns();setTimeout(loadIns,45000)}else toast('No autorizado o error')}catch(e){toast('Error de conexión')}}
async function loadIns(){try{const r=await fetch(`https://api.github.com/repos/${INSC_REPO}/contents/inscritos.json`,{headers:{Accept:'application/vnd.github.raw+json'},cache:'no-store'});
INS=r.ok?await r.json():[];if(!Array.isArray(INS))INS=[]}catch(e){INS=[]}insLoaded=true;if(tab=='insc')paintIns()}
function paintIns(){const sel=$('#inclub'),ls=$('#inlist');if(!sel||!ls)return;
const used=new Set([...INS.map(i=>i.club),...S.P.map(p=>p.club)].map(x=>x.toLowerCase()));
const cur=sel.value,free=CLS.map(c=>c[0]).filter(n=>!used.has(n.toLowerCase())).sort((a,b)=>a.localeCompare(b));
sel.innerHTML=free.length?free.map(n=>`<option${n==cur?' selected':''}>${esc(n)}</option>`).join(''):'<option value="">No quedan clubes libres</option>';
$('#incount').textContent=INS.length;
ls.innerHTML=INS.length?INS.map(i=>`<div class="il">${crest(i.club,24)}<b>${esc(i.nombre)}</b><span class="mu">${esc(i.club)}</span>${ADMIN?`<button class="d" data-n="${esc(i.nombre)}" onclick="delIns(this.dataset.n)">✕</button>`:''}</div>`).join(''):`<span class="mu">${insLoaded?'Aún no hay inscritos.':'Cargando…'}</span>`}
async function sendIns(){const m=$('#inmsg'),b=$('#inbtn'),n=$('#innom').value.trim().replace(/\s+/g,' '),c=$('#inclub').value;
if(n.length<2)return m.textContent='Escribe un nombre válido (mín. 2 caracteres).';
if(!c)return m.textContent='Elige un club.';
if(INS.some(i=>i.nombre.toLowerCase()==n.toLowerCase()))return m.textContent='Ese nombre ya está inscrito.';
if(INS.some(i=>i.club.toLowerCase()==c.toLowerCase()))return m.textContent='Ese club ya está cogido.';
b.disabled=true;m.textContent='Enviando…';
try{const r=await fetch(INSC_WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre:n,club:c})});const d=await r.json();
if(d.ok){m.textContent='¡Enviado! Tu inscripción aparecerá en 1-2 minutos.';$('#innom').value='';setTimeout(loadIns,45000);setTimeout(loadIns,90000)}
else m.textContent='No se pudo enviar. Inténtalo de nuevo.'}catch(e){m.textContent='Error de conexión.'}b.disabled=false}
function insToTorneo(){const nuevos=INS.filter(i=>!S.P.some(p=>p.n.toLowerCase()==i.nombre.toLowerCase()||p.club.toLowerCase()==i.club.toLowerCase()));
if(!nuevos.length)return toast('No hay inscritos nuevos que añadir');
if(!ok('insimp','Se añadirán '+nuevos.length+' inscritos al torneo'))return;bk('Antes de importar inscritos');
nuevos.forEach(i=>{const g=S.groups.map(x=>[x,S.P.filter(p=>p.g==x.id).length]).sort((a,b)=>a[1]-b[1])[0][0].id;S.P.push({id:S.nid++,n:i.nombre,club:i.club,g})});
if(S.F.length)S.dirty=true;save();render();toast(nuevos.length+' participantes añadidos')}
V.insc=()=>{setTimeout(()=>{paintIns();if(!insLoaded)loadIns()},0);
return `<div id="inwrap"><div class="card"><h3>Inscripción Online</h3>
<label>Nombre / Nick<input id="innom" maxlength="24" autocomplete="off" placeholder="Tu nick" onkeydown="if(event.key=='Enter')sendIns()"></label>
<label style="margin-top:10px">Club<select id="inclub"></select></label>
<button class="btn" id="inbtn" onclick="sendIns()">Apuntarme</button><div id="inmsg"></div></div>
<div class="card"><h3>Inscritos (<span id="incount">0</span>)</h3><div id="inlist"></div>
<div class="row" style="margin-top:10px"><button class="s" onclick="loadIns()">Actualizar lista</button>${ADMIN?`<button class="s" onclick="insToTorneo()">Añadir inscritos al torneo</button><button class="d" onclick="clearIns()">Vaciar inscripciones</button>`:''}</div></div></div>`};
const TABS=[['inicio','Inicio'],['part','Participantes'],['cal','Calendario'],['cla','Clasificación'],['est','Estadísticas'],['fin','Fase final'],['insc','Inscripción Online'],['dat','Datos']];
function render(){if(!ADMIN)tab='insc';$('#tn').textContent=ADMIN?S.cfg.name:'Inscripciones abiertas';
const vis=ADMIN?TABS:TABS.filter(t=>t[0]=='insc');
$('#nav').innerHTML=vis.map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('')+(ADMIN?`<button class="s" style="margin-left:auto" onclick="adminLogout()">Salir admin</button>`:`<button class="s" style="margin-left:auto" onclick="adminLogin()">🔒 Admin</button>`);
$('#app').innerHTML=V[tab]()}
render();
(async()=>{let pw='';try{pw=sessionStorage.getItem('pes6_adm')||''}catch(e){}if(!pw)return;try{const d=await wk({action:'login',password:pw});if(d.ok){ADMIN=true;APW=pw;tab='inicio';render()}}catch(e){}})();
</script></body></html>
