<style>
:root{color-scheme:dark;--bg:#0a1110;--c:#12201b;--c2:#1a2c25;--g:#22c55e;--t:#e8f1ec;--m:#8aa399;--r:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(90deg,#052e16,#0f3d27);border-bottom:2px solid var(--g);padding:10px 14px;display:flex;align-items:center;gap:10px}
header b{font-size:18px;letter-spacing:.5px}header small{color:var(--m);display:block}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;background:#0d1815;position:sticky;top:0;z-index:5}
nav button{background:none;border:0;color:var(--m);padding:8px 12px;border-radius:6px;white-space:nowrap;cursor:pointer;font-weight:600}
nav button.on{background:var(--g);color:#04210f}
main{max-width:1000px;margin:0 auto;padding:12px}
.card{background:var(--c);border:1px solid #223a31;border-radius:10px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;color:var(--g);text-transform:uppercase;font-size:13px;letter-spacing:1px}
button,select,input,textarea{font:inherit}
.btn,.card button{background:var(--g);color:#04210f;border:0;border-radius:6px;padding:7px 12px;font-weight:700;cursor:pointer}
button.s{background:var(--c2)!important;color:var(--t)!important}button.d{background:var(--r)!important;color:#fff!important}
input,select,textarea{background:#0b1512;color:var(--t);border:1px solid #2b4a3d;border-radius:6px;padding:6px 8px;max-width:100%}
textarea{width:100%;min-height:90px}label{display:flex;flex-direction:column;gap:3px;color:var(--m);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:6px 7px;text-align:center;border-bottom:1px solid #1f352c;white-space:nowrap}
th{color:var(--m);font-size:11px;text-transform:uppercase}td.l,th.l{text-align:left}tr.q td:first-child{box-shadow:inset 3px 0 var(--g)}
.tm{display:inline-flex;align-items:center;gap:6px}.tm small{color:var(--m)}.cr{flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chips button{background:var(--c2);color:var(--t);border:1px solid #2b4a3d;border-radius:20px;padding:4px 11px;cursor:pointer}
.chips button.on{background:var(--g);color:#04210f}.chips button.ok{border-color:var(--g)}
.m{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #1f352c}
.m .a{justify-self:end;text-align:right}.sc{display:flex;gap:4px;align-items:center}.sc input{width:70px;height:46px;font-size:24px;font-weight:800;text-align:center;padding:4px;-moz-appearance:textfield}.sc input::-webkit-outer-spin-button,.sc input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.po .sc input{width:54px;height:40px;font-size:20px}
.warn{background:#3a2f0b;border:1px solid #a16207;border-radius:8px;padding:8px 12px;margin-bottom:12px}
.big{font-size:26px;font-weight:800;color:var(--g)}.mu{color:var(--m)}.bold{font-weight:800}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#fff;color:#111;padding:9px 16px;border-radius:8px;font-weight:600;display:none;z-index:9;max-width:90%}
.po{display:flex;gap:14px;overflow-x:auto}.po>div{min-width:230px;flex:1}.pm{background:var(--c2);border-radius:8px;padding:8px;margin-bottom:10px}
.pm .sc{justify-content:space-between;margin:3px 0}.champ{text-align:center;padding:16px;background:linear-gradient(135deg,#14532d,#0f3d27);border-radius:10px;font-size:20px;font-weight:800;margin-bottom:12px}
@media(max-width:560px){.m{grid-template-columns:1fr;justify-items:center;text-align:center}.m .a{justify-self:center;text-align:center}}
#inwrap{max-width:460px;margin:0 auto}
#inwrap input,#inwrap select{width:100%;padding:12px;font-size:16px}
#inwrap .btn{width:100%;margin-top:14px;padding:13px;font-size:16px}
#inwrap .btn:disabled{opacity:.5;cursor:not-allowed}
#inmsg{margin-top:12px;min-height:1.4em;font-weight:600}
.il{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #1f352c}.il span.mu{margin-left:auto;font-size:12px}
header .logo{height:46px;width:auto;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CLS="Athletic Club|#dc2626,FC Barcelona|#a50044,Real Betis|#0bb363,Celta de Vigo|#7ec8ee,RCD Espanyol|#1d4ed8,Elche CF|#16a34a,CA Osasuna|#b91c1c,Levante UD|#b3123a,Deportivo Alavés|#1e40af,Cádiz CF|#facc15,Atlético de Madrid|#cb3524,Real Madrid|#e5e7eb,RCD Mallorca|#c8102e,Getafe CF|#2563eb,Rayo Vallecano|#e11d48,Granada CF|#9f1239,Villarreal CF|#eab308,Valencia CF|#f59e0b,Sevilla FC|#d11f2d,Real Sociedad|#3b82f6".split(',').map(x=>x.split('|'));
const CM=Object.fromEntries(CLS);
// ---------- IMÁGENES DE LOS CLUBES (PLANTILLA) ----------
// Pon aquí la ruta de la imagen de cada club entre las comillas. Déjalo vacío ("") para usar el escudo automático.
// Ejemplo: "Real Madrid":"img/real-madrid.png"  (sube la imagen a la carpeta img/ del repositorio)
// También puedes usar una URL completa (https://...). Si la imagen no carga, se muestra el escudo automático.
const IMG={
"Athletic Club":"assets/athletic.png",
"FC Barcelona":"assets/barcelona.png",
"Real Betis":"assets/betis.webp",
"Celta de Vigo":"assets/celta.webp",
"RCD Espanyol":"assets/espanyol.png",
"Elche CF":"assets/elche.webp",
"CA Osasuna":"assets/osasuna.webp",
"Levante UD":"assets/levante.svg",
"Deportivo Alavés":"assets/alaves.png",
"Cádiz CF":"assets/cadiz.png",
"Atlético de Madrid":"assets/atletico.png",
"Real Madrid":"assets/realmadrid.webp",
"RCD Mallorca":"assets/mallorca.png",
"Getafe CF":"assets/getafe.webp",
"Rayo Vallecano":"assets/rayo.svg",
"Granada CF":"assets/granada.webp",
"Villarreal CF":"assets/villareal.webp",
"Valencia CF":"assets/valencia.svg",
"Sevilla FC":"assets/sevilla.webp",
"Real Sociedad":"assets/realsociedad.webp"
};
const shuf=a=>{a=[...a];for(let i=a.length;i>1;){const j=Math.random()*i|0;i--;[a[i],a[j]]=[a[j],a[i]]}return a};
const lum=c=>{const n=parseInt(c.slice(1),16);return(n>>16)*.3+((n>>8)&255)*.6+(n&255)*.1};
function crest(n,sz=26){let bg=CM[n],fg;if(bg)fg=lum(bg)>150?'#111':'#fff';else{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;bg=`hsl(${h},55%,38%)`;fg='#fff'}
const t=esc(n.replace(/[^A-Za-zÀ-ÿ ]/g,'').split(' ').filter(Boolean).map(w=>w[0]).join('').slice(0,3).toUpperCase());
const im=IMG[n];const h=sz*1.15|0;const svg=`<svg class="cr" width="${sz}" height="${sz*1.15|0}" viewBox="0 0 24 28"><path d="M2 2h20v12c0 7-6 11-10 12C8 25 2 21 2 14z" fill="${bg}" stroke="#fff" stroke-width="1.5"/><text x="12" y="17" text-anchor="middle" font-size="${t.length>2?8:10}" font-weight="800" fill="${fg}">${t}</text></svg>`;
if(!im)return svg;return `<img class="cr" src="${esc(im)}" alt="${esc(n)}" width="${sz}" height="${h}" onerror="this.style.display='none';this.nextElementSibling.style.display=''">${svg.replace('<svg ','<svg style="display:none" ')}`}
const K='pes6lm',KB='pes6lm_bk';
const fresh=()=>({cfg:{name:'Mi torneo PES 6',legs:2,dup:false,fin:false,q:2,win:3,draw:1},groups:[{id:1,name:'Liga'}],P:[],F:[],po:null,nid:1,dirty:false});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S&&S.cfg?S:fresh();
let tab='inicio',cg=null,crd={},armed=null;
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)}
function ok(k,msg){if(armed==k){armed=null;return true}armed=k;toast(msg+' — pulsa de nuevo para confirmar');setTimeout(()=>armed==k&&(armed=null),4000);return false}
function bks(){try{return JSON.parse(localStorage.getItem(KB))||[]}catch(e){return[]}}
function bk(l){try{const b=bks();b.unshift({t:Date.now(),l,d:JSON.stringify(S)});localStorage.setItem(KB,JSON.stringify(b.slice(0,5)))}catch(e){}}
const P=id=>S.P.find(p=>p.id==id);
const tm=(id,sm=1)=>{const p=P(id);return p?`<span class="tm">${crest(p.club,22)}<span><b>${esc(p.club)}</b>${sm?`<small> ${esc(p.n)}</small>`:''}</span></span>`:'—'};
const opts=(v,a)=>a.map(([x,l])=>`<option value="${x}"${x==v?' selected':''}>${l}</option>`).join('');
const played=f=>f.hg!=null&&f.ag!=null;
// ---------- calendario ----------
function sched(ids){let a=shuf(ids);if(a.length%2)a.push(null);const n=a.length,R=[];
for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x==null||y==null)continue;m.push((i==0?r%2:(r+i)%2)?[y,x]:[x,y])}R.push(m);a.splice(1,0,a.pop())}
return S.cfg.legs==2?R.concat(R.map(m=>m.map(([h,a])=>[a,h]))):R}
function gen(){if(S.P.length<2)return toast('Añade participantes');
if(S.groups.some(g=>S.P.filter(p=>p.g==g.id).length<2))return toast('Cada grupo necesita 2 o más participantes');
if(S.F.some(played)&&!ok('gen','Se borrarán los resultados'))return;
bk('Antes de generar calendario');S.F=[];S.po=null;S.dirty=false;crd={};
S.groups.forEach(g=>sched(S.P.filter(p=>p.g==g.id).map(p=>p.id)).forEach((m,ri)=>m.forEach(([h,a])=>S.F.push({id:S.nid++,g:g.id,r:ri+1,h,a,hg:null,ag:null}))));
save();render();toast('Calendario generado')}
// ---------- clasificación ----------
function table(g){const T={};S.P.filter(p=>p.g==g).forEach(p=>T[p.id]={id:p.id,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0});
const pl=S.F.filter(f=>f.g==g&&played(f));
pl.forEach(f=>{const h=T[f.h],a=T[f.a];if(!h||!a)return;h.pj++;a.pj++;h.gf+=f.hg;h.gc+=f.ag;a.gf+=f.ag;a.gc+=f.hg;
if(f.hg>f.ag){h.g++;a.p++;h.pts+=S.cfg.win}else if(f.hg<f.ag){a.g++;h.p++;a.pts+=S.cfg.win}else{h.e++;a.e++;h.pts+=S.cfg.draw;a.pts+=S.cfg.draw}});
const h2h=(x,y)=>{let s=0;pl.forEach(f=>{if(f.h==x&&f.a==y||f.h==y&&f.a==x){const gx=f.h==x?f.hg:f.ag,gy=f.h==x?f.ag:f.hg;s+=gx>gy?S.cfg.win:gx==gy?S.cfg.draw:0}});return s};
return Object.values(T).sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf||h2h(b.id,a.id)-h2h(a.id,b.id)||P(a.id).club.localeCompare(P(b.id).club))}
// ---------- acciones ----------
function addP(n,g){if(!g)g=S.groups.map(x=>[x,S.P.filter(p=>p.g==x.id).length]).sort((a,b)=>a[1]-b[1])[0][0].id;
const used=S.P.map(p=>p.club),free=shuf(CLS.map(c=>c[0])).filter(c=>S.cfg.dup||!used.includes(c));
S.P.push({id:S.nid++,n,club:free[0]||CLS[Math.random()*CLS.length|0][0],g});if(S.F.length)S.dirty=true}

function qual(){const o=[];S.groups.forEach(g=>table(g.id).slice(0,S.cfg.q).forEach((r,i)=>o.push({id:r.id,pos:i,pts:r.pts,gd:r.gf-r.gc,gf:r.gf})));
return o.sort((a,b)=>a.pos-b.pos||b.pts-a.pts||b.gd-a.gd||b.gf-a.gf).map(x=>x.id)}
function startPO(){const s=qual(),n=s.length;if(![2,4,8,16].includes(n))return toast(`Clasifican ${n}: debe ser 2, 4, 8 o 16 (ajusta «clasifican por grupo»)`);
if(S.F.some(f=>!played(f))&&!ok('po','Aún hay partidos pendientes en la liga'))return;S.po={seeds:s,res:{}};save();render()}
const ord=N=>{let o=[0,1];while(o.length<N){const m=o.length*2;o=o.flatMap(x=>[x,m-1-x])}return o};
const win=(p,x)=>{if(p[0]==null||p[1]==null||x.h==null||x.a==null)return null;if(x.h>x.a)return p[0];if(x.a>x.h)return p[1];return x.ph!=null&&x.pa!=null&&x.ph!=x.pa?(x.ph>x.pa?p[0]:p[1]):null};
function bracket(){const s=S.po.seeds,o=ord(s.length);let cur=[];for(let i=0;i<o.length;i+=2)cur.push([s[o[i]],s[o[i+1]]]);const R=[];let r=0;
for(;;){const ms=cur.map((p,m)=>{const k=r+'_'+m,x=S.po.res[k]||{};return{p,k,x,w:win(p,x)}});R.push(ms);if(cur.length==1)break;const nx=[];for(let i=0;i<ms.length;i+=2)nx.push([ms[i].w,ms[i+1].w]);cur=nx;r++}return R}

ls.innerHTML=INS.length?INS.map(i=>`<div class="il">${crest(i.club,24)}<b>${esc(i.nombre)}</b><span class="mu">${esc(i.club)}</span>${ADMIN?`<button class="d" data-n="${esc(i.nombre)}" onclick="delIns(this.dataset.n)">✕</button>`:''}</div>`).join(''):`<span class="mu">${insLoaded?'Aún no hay inscritos.':'Cargando…'}</span>`}
async function sendIns(){const m=$('#inmsg'),b=$('#inbtn'),n=$('#innom').value.trim().replace(/\s+/g,' '),c=$('#inclub').value;
if(n.length<2)return m.textContent='Escribe un nombre válido (mín. 2 caracteres).';
if(!c)return m.textContent='Elige un club.';
if(INS.some(i=>i.nombre.toLowerCase()==n.toLowerCase()))return m.textContent='Ese nombre ya está inscrito.';
if(INS.some(i=>i.club.toLowerCase()==c.toLowerCase()))return m.textContent='Ese club ya está cogido.';
b.disabled=true;m.textContent='Enviando…';
try{const r=await fetch(INSC_WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre:n,club:c})});const d=await r.json();
if(d.ok){m.textContent='¡Enviado! Tu inscripción aparecerá en 1-2 minutos.';$('#innom').value='';setTimeout(loadIns,45000);setTimeout(loadIns,90000)}
else m.textContent='No se pudo enviar. Inténtalo de nuevo.'}catch(e){m.textContent='Error de conexión.'}b.disabled=false}
function insToTorneo(){const nuevos=INS.filter(i=>!S.P.some(p=>p.n.toLowerCase()==i.nombre.toLowerCase()||p.club.toLowerCase()==i.club.toLowerCase()));
if(!nuevos.length)return toast('No hay inscritos nuevos que añadir');
if(!ok('insimp','Se añadirán '+nuevos.length+' inscritos al torneo'))return;bk('Antes de importar inscritos');
nuevos.forEach(i=>{const g=S.groups.map(x=>[x,S.P.filter(p=>p.g==x.id).length]).sort((a,b)=>a[1]-b[1])[0][0].id;S.P.push({id:S.nid++,n:i.nombre,club:i.club,g})});
if(S.F.length)S.dirty=true;save();render();toast(nuevos.length+' participantes añadidos')}
V.insc=()=>{setTimeout(()=>{paintIns();if(!insLoaded)loadIns()},0);
return `<div id="inwrap"><div class="card"><h3>Inscripción Online</h3>
<label>Nombre / Nick<input id="innom" maxlength="24" autocomplete="off" placeholder="Tu nick" onkeydown="if(event.key=='Enter')sendIns()"></label>
<label style="margin-top:10px">Club<select id="inclub"></select></label>
<button class="btn" id="inbtn" onclick="sendIns()">Apuntarme</button><div id="inmsg"></div></div>
<div class="card"><h3>Inscritos (<span id="incount">0</span>)</h3><div id="inlist"></div>
<div class="row" style="margin-top:10px"><button class="s" onclick="loadIns()">Actualizar lista</button>${ADMIN?`<button class="s" onclick="insToTorneo()">Añadir inscritos al torneo</button><button class="d" onclick="clearIns()">Vaciar inscripciones</button>`:''}</div></div></div>`};
const TABS=[['inicio','Inicio'],['part','Participantes'],['cal','Calendario'],['cla','Clasificación'],['est','Estadísticas'],['fin','Fase final'],['insc','Inscripción Online'],['dat','Datos']];
function render(){if(!ADMIN)tab='insc';$('#tn').textContent=ADMIN?S.cfg.name:'Inscripciones abiertas';
const vis=ADMIN?TABS:TABS.filter(t=>t[0]=='insc');
$('#nav').innerHTML=vis.map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('')+(ADMIN?`<button class="s" style="margin-left:auto" onclick="adminLogout()">Salir admin</button>`:`<button class="s" style="margin-left:auto" onclick="adminLogin()">🔒 Admin</button>`);
$('#app').innerHTML=V[tab]()}
render();
